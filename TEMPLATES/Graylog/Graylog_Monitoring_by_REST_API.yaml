                  value: inputs
                - tag: template
                  value: Graylog-HTTP-API
            - uuid: d43ac78b789c4d89af302c79a57dca9e
              name: 'Input [{#INPUT.TYPE} {#INPUT.TRANSPORT} {#INPUT.ID}]: Processed rate'
              type: DEPENDENT
              key: 'graylog.input.processed.m1rate[{#INPUT.ID}]'
              delay: '0'
              value_type: FLOAT
              units: msg/s
              description: 'One-minute codec processing rate.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["meters"]["{#CODEC.METRIC.PREFIX}.processedMessages"]["m1_rate"]'
                  error_handler: DISCARD_VALUE
