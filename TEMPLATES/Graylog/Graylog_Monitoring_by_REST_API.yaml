        - uuid: d8f86497d6df45e48108b61ccb20d40e
          name: 'Graylog indexer cluster health: Get data'
          type: HTTP_AGENT
          key: graylog.indexer.health.raw
          delay: '{$GRAYLOG.INDEXER.HEALTH.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$GRAYLOG.API.USER}'
          password: '{$GRAYLOG.API.PASSWORD}'
          description: 'Retrieves the Graylog indexer cluster health payload.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var s=String(value).trim(); if (!s || s.charAt(0)===''<'') throw ''Invalid response''; var d=JSON.parse(s); if (!d.status || !d.shards || typeof d.shards!==''object'') throw ''Unexpected indexer health payload''; return s;'
          timeout: '{$GRAYLOG.API.TIMEOUT}'
          url: '{$GRAYLOG.API.SCHEME}://{$GRAYLOG.ENDPOINT}:{$GRAYLOG.API.PORT}{$GRAYLOG.INDEXER.HEALTH.PATH}'
          headers:
            - name: Accept
              value: application/json
          verify_peer: 'YES'
          verify_host: 'YES'
          tags:
            - tag: component
              value: indexing
            - tag: template
              value: Graylog-HTTP-API
        - uuid: a370ec28b5ac40dda7eb838d5b3dc164
          name: 'Graylog indexer cluster health status'
          type: DEPENDENT
          key: graylog.indexer.health.status
          delay: '0'
          description: 'Numeric indexer health status: 2 is green, 1 is yellow, 0 is red, and -1 is invalid or unavailable.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value===''ERROR_STATE'')return -1;try{var s=JSON.parse(value).status;if(s===''green'')return 2;if(s===''yellow'')return 1;if(s===''red'')return 0;return -1;}catch(e){return -1;}'
          master_item:
            key: graylog.indexer.health.raw
          tags:
            - tag: component
