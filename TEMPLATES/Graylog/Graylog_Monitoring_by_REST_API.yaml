            - uuid: 8d36ab72f4ef4d0e8e125fd1ced6060b
              name: 'Input [{#INPUT.TYPE} {#INPUT.TRANSPORT} {#INPUT.ID}]: Parse time p95'
              type: DEPENDENT
              key: 'graylog.input.parse_time.p95[{#INPUT.ID}]'
