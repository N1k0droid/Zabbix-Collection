            - uuid: 2de62f3c5e7548468d28b1e5c848ce82
              name: 'Event processor [{#PROCESSOR.ID}]: Successful'
              type: DEPENDENT
              key: 'graylog.eventprocessor.successful[{#PROCESSOR.ID}]'
              delay: '0'
              description: 'Cumulative successful executions.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["counters"]["org.graylog.events.processor.aggregation.AggregationEventProcessor.{#PROCESSOR.ID}.execution_successful"]["count"]'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'graylog.eventprocessor.raw[{#PROCESSOR.ID}]'
              tags:
                - tag: component
                  value: eventprocessor
                - tag: template
                  value: Graylog-HTTP-API
          master_item:
            key: graylog.metrics.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var result = [];
                  var seen = {};
                  var prefix = 'org.graylog.events.processor.aggregation.AggregationEventProcessor.';
                  var sections = ['counters', 'gauges', 'meters', 'timers', 'histograms'];
                  
                  sections.forEach(function (section) {
                      Object.keys(d[section] || {}).forEach(function (key) {
                          if (key.indexOf(prefix) !== 0) return;
                  
                          var id = key.substring(prefix.length).split('.')[0];
                          if (!/^[a-f0-9]{24}$/.test(id) || seen[id] || result.length >= 100) return;
                  
                          seen[id] = true;
                          result.push({'{#PROCESSOR.ID}': id});
                      });
                  });
                  
                  return JSON.stringify(result);
        - uuid: feb8ca036c6e45999aafc909af557ca7
