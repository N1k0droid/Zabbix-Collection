            - uuid: 3955bd827194416c84b42527de900f6e
              name: 'Input [{#INPUT.TYPE} {#INPUT.TRANSPORT} {#INPUT.ID}]: Raw metrics payload'
              type: DEPENDENT
              key: 'graylog.input.raw[{#INPUT.ID}]'
              delay: '0'
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Raw Graylog metrics payload used as the master item for this discovered input.'
              master_item:
                key: graylog.metrics.raw
              tags:
                - tag: component
                  value: inputs
                - tag: template
                  value: Graylog-HTTP-API
            - uuid: cb4036320c2742c799cf411f85d88562
              name: 'Input [{#INPUT.TYPE} {#INPUT.TRANSPORT} {#INPUT.ID}]: Read rate'
              type: DEPENDENT
              key: 'graylog.input.read_bytes_1sec[{#INPUT.ID}]'
              delay: '0'
              value_type: FLOAT
              units: Bps
              description: 'Current byte receive rate.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["gauges"]["{#INPUT.METRIC.PREFIX}.read_bytes_1sec"]["value"]'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'graylog.input.raw[{#INPUT.ID}]'
              tags:
                - tag: component
                  value: inputs
                - tag: template
                  value: Graylog-HTTP-API
          master_item:
            key: graylog.metrics.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var result = [];
                  var seen = {};
                  var prefix = 'org.graylog2.inputs.';
                  var validMetrics = {
                      open_connections: true,
                      read_bytes_1sec: true,
                      incomingMessages: true,
                      emptyMessages: true,
                      rawSize: true
                  };
                  
                  var sections = ['gauges', 'meters', 'counters', 'timers', 'histograms'];
                  var keys = [];
                  sections.forEach(function (section) {
                      keys = keys.concat(Object.keys(d[section] || {}));
                  });
                  
                  keys.forEach(function (key) {
                      if (key.indexOf(prefix) !== 0) return;
                  
                      var parts = key.substring(prefix.length).split('.');
                      if (parts.length < 3) return;
                  
                      var metric = parts[parts.length - 1];
                      if (!validMetrics[metric]) return;
                  
                      var id = parts[parts.length - 2];
                      var className = parts[parts.length - 3];
                      var inputPath = parts.slice(0, parts.length - 2).join('.');
                      if (!/^[a-f0-9]{24}$/.test(id)) return;
                      if (!/Input$/.test(className)) return;
                      var uniqueKey = className + '|' + id;
                      if (seen[uniqueKey] || result.length >= 100) return;
                  
                      var transport = 'Other';
                      if (inputPath.indexOf('.tcp.') >= 0 || inputPath.slice(-4) === '.tcp') transport = 'TCP';
                      else if (inputPath.indexOf('.udp.') >= 0 || inputPath.slice(-4) === '.udp') transport = 'UDP';
                  
                      var inputType = className.replace(/(?:TCP|UDP)?Input$/, '');
                      var codecClass;
                      if (inputType === 'GELF') codecClass = 'GelfCodec';
                      else if (inputType === 'Syslog') codecClass = 'SyslogCodec';
                      else if (inputType === 'Raw') codecClass = 'RawCodec';
                      else codecClass = inputType + 'Codec';
                  
                      seen[uniqueKey] = true;
                      result.push({
                          '{#INPUT.ID}': id,
                          '{#INPUT.CLASS}': className,
                          '{#INPUT.TYPE}': inputType,
                          '{#INPUT.TRANSPORT}': transport,
                          '{#INPUT.METRIC.PREFIX}': prefix + inputPath + '.' + id,
                          '{#CODEC.METRIC.PREFIX}': prefix + 'codecs.' + codecClass + '.' + id
                      });
                  });
                  
                  return JSON.stringify(result);
        - uuid: 7a0df27992bd4e259ebd9a95b677d496
          name: 'Graylog scheduler metric discovery'
          type: DEPENDENT
          key: graylog.scheduler.discovery
          delay: '0'
          description: 'Discovers only a fixed allowlist of scheduler metrics exposed by the monitored Graylog version. Creates at most seven metric items and supports current JobExecutionEngine metrics and legacy SystemJobManager metrics.'
          item_prototypes:
            - uuid: f12f10472edb46cebc68dbcdfcd719db
              name: 'Scheduler: {#SCHEDULER.NAME}'
              type: DEPENDENT
              key: 'graylog.scheduler.metric[{#SCHEDULER.KEY}]'
              delay: '0'
              value_type: FLOAT
              units: '{#SCHEDULER.UNITS}'
              description: 'Collects the discovered scheduler metric when it is exposed by the monitored Graylog version.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["{#SCHEDULER.SECTION}"]["{#SCHEDULER.METRIC}"]["{#SCHEDULER.FIELD}"]'
                  error_handler: DISCARD_VALUE
              master_item:
                key: graylog.metrics.raw
              tags:
                - tag: component
                  value: scheduler
                - tag: template
                  value: Graylog-HTTP-API
          master_item:
            key: graylog.metrics.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var result = [];
                  var definitions = [
                      {id:'failed', section:'counters', metric:'org.graylog.scheduler.JobExecutionEngine.executions.failed', field:'count', name:'Failed executions', key:'executions.failed', kind:'counter', units:''},
                      {id:'execution_time_p95', section:'timers', metric:'org.graylog.scheduler.JobExecutionEngine.executions.time', field:'p95', name:'Execution time p95', key:'execution_time.p95', kind:'timer', units:'s'},
                      {id:'free_slots', section:'gauges', metric:'org.graylog.scheduler.worker.JobWorkerPool.free_slots', field:'value', name:'Free slots', key:'free_slots', kind:'gauge', units:''},
                      {id:'total_slots', section:'gauges', metric:'org.graylog.scheduler.worker.JobWorkerPool.total_slots', field:'value', name:'Total slots', key:'total_slots', kind:'gauge', units:''},
                      {id:'waiting_slots', section:'gauges', metric:'org.graylog.scheduler.worker.JobWorkerPool.waiting_for_slots', field:'value', name:'Waiting jobs', key:'waiting_slots', kind:'gauge', units:''},
                      {id:'legacy_running', section:'gauges', metric:'org.graylog2.system.jobs.SystemJobManager.running', field:'value', name:'Legacy running jobs', key:'legacy.running', kind:'gauge', units:''},
                      {id:'legacy_total', section:'gauges', metric:'org.graylog2.system.jobs.SystemJobManager.total', field:'value', name:'Legacy total jobs', key:'legacy.total', kind:'gauge', units:''}
                  ];
                  definitions.forEach(function (x) {
                      var section = d[x.section] || {};
                      var metric = section[x.metric];
                      if (!metric || typeof metric[x.field] === 'undefined') return;
                      result.push({
                          '{#SCHEDULER.ID}': x.id,
                          '{#SCHEDULER.NAME}': x.name,
                          '{#SCHEDULER.KEY}': x.key,
                          '{#SCHEDULER.SECTION}': x.section,
                          '{#SCHEDULER.METRIC}': x.metric,
                          '{#SCHEDULER.FIELD}': x.field,
                          '{#SCHEDULER.KIND}': x.kind,
                          '{#SCHEDULER.UNITS}': x.units
                      });
                  });
                  return JSON.stringify(result);
        - uuid: ad2c6b1bd5c64deeb6b5cb9d68c01918
          name: 'Configured Graylog stream discovery'
          type: DEPENDENT
          key: graylog.stream.discovery
          delay: '0'
          description: 'Discovers only stream IDs listed in {$GRAYLOG.STREAM.IDS} and present in the metrics payload. The macro is empty by default, so this rule creates no items unless explicitly configured. The hard limit is 20 streams.'
