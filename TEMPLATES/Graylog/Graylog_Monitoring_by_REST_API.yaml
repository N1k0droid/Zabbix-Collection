                  value: Graylog-HTTP-API
              trigger_prototypes:
                - uuid: ab1480a0305d4d1a9ef956ee4a292721
                  expression: 'max(/Template - Graylog Monitoring by REST API/graylog.stream.incoming.m1rate[{#STREAM.ID}],{$GRAYLOG.STREAM.NODATA.PERIOD})=0'
                  name: 'Graylog: Stream [{#STREAM.ID}] has no incoming traffic'
                  status: DISABLED
                  priority: WARNING
                  description: 'Alerts when the configured stream has no incoming traffic during the configured period. Enable only for streams expected to receive messages continuously.'
                  tags:
                    - tag: scope
                      value: performance
                    - tag: template
                      value: Graylog-HTTP-API
                - uuid: 487a222385164205bb2903a4d6ff6b3c
                  expression: 'avg(/Template - Graylog Monitoring by REST API/graylog.stream.incoming.m1rate[{#STREAM.ID}],{$GRAYLOG.STREAM.BASELINE.PERIOD})>{$GRAYLOG.STREAM.BASELINE.MIN} and avg(/Template - Graylog Monitoring by REST API/graylog.stream.incoming.m1rate[{#STREAM.ID}],{$GRAYLOG.STREAM.SHORT.PERIOD})<avg(/Template - Graylog Monitoring by REST API/graylog.stream.incoming.m1rate[{#STREAM.ID}],{$GRAYLOG.STREAM.BASELINE.PERIOD})*(1-{$GRAYLOG.STREAM.DECREASE.PCT}/100)'
                  name: 'Graylog: Stream [{#STREAM.ID}] traffic decreased sharply'
                  priority: WARNING
                  description: 'Alerts when the short-period stream rate falls below the baseline average by the configured percentage.'
                  tags:
                    - tag: scope
                      value: performance
                    - tag: template
                      value: Graylog-HTTP-API
                - uuid: ce0eb859d8954dfaa28752c11b9f8e67
                  expression: 'avg(/Template - Graylog Monitoring by REST API/graylog.stream.incoming.m1rate[{#STREAM.ID}],{$GRAYLOG.STREAM.BASELINE.PERIOD})>{$GRAYLOG.STREAM.BASELINE.MIN} and avg(/Template - Graylog Monitoring by REST API/graylog.stream.incoming.m1rate[{#STREAM.ID}],{$GRAYLOG.STREAM.SHORT.PERIOD})>avg(/Template - Graylog Monitoring by REST API/graylog.stream.incoming.m1rate[{#STREAM.ID}],{$GRAYLOG.STREAM.BASELINE.PERIOD})*(1+{$GRAYLOG.STREAM.INCREASE.PCT}/100)'
                  name: 'Graylog: Stream [{#STREAM.ID}] traffic increased sharply'
                  priority: WARNING
                  description: 'Alerts when the short-period stream rate exceeds the baseline average by the configured percentage.'
                  tags:
                    - tag: scope
                      value: performance
                    - tag: template
                      value: Graylog-HTTP-API
          master_item:
            key: graylog.metrics.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var configured = '{$GRAYLOG.STREAM.IDS}'.trim();
                  if (configured === '') return '[]';
                  var limit = parseInt('{$GRAYLOG.STREAM.MAX}', 10);
                  if (!isFinite(limit) || limit < 1) return '[]';
                  if (limit > 20) limit = 20;
                  var meters = d.meters || {};
                  var prefix = 'org.graylog2.plugin.streams.Stream.';
                  var suffix = '.incomingMessages';
                  var result = [];
                  var seen = {};
                  configured.split(',').forEach(function (entry) {
                      if (result.length >= limit) return;
                      var id = entry.trim().toLowerCase();
                      if (!/^[a-f0-9]{24}$/.test(id) || seen[id]) return;
                      var metric = prefix + id + suffix;
                      var data = meters[metric];
                      if (!data || typeof data.count === 'undefined') return;
                      seen[id] = true;
                      result.push({
                          '{#STREAM.ID}': id,
                          '{#STREAM.METRIC}': metric
                      });
                  });
                  return JSON.stringify(result);
        - uuid: c26624b9a75847379c8b3997ed9a8773
          name: 'Configured Graylog stream rule discovery'
          type: DEPENDENT
          key: graylog.stream.rule.discovery
          delay: '0'
          description: 'Discovers only stream and rule ID pairs listed in {$GRAYLOG.STREAM.RULES} and present in the metrics payload. The macro is empty by default, so this rule creates no items unless explicitly configured. The hard limit is 20 rules.'
          item_prototypes:
            - uuid: 2fb86fc8a6014dbfa9eb6fdb2a4ef609
              name: 'Stream [{#STREAM.ID}] rule [{#RULE.ID}]: Execution time p95'
              type: DEPENDENT
              key: 'graylog.stream.rule.execution_time.p95[{#STREAM.ID},{#RULE.ID}]'
              delay: '0'
              value_type: FLOAT
              units: s
              description: '95th percentile execution time for the explicitly configured Graylog stream rule.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["timers"]["{#STREAM.RULE.METRIC}"]["p95"]'
                  error_handler: DISCARD_VALUE
              master_item:
                key: graylog.metrics.raw
              tags:
                - tag: component
                  value: stream-rules
                - tag: template
                  value: Graylog-HTTP-API
              trigger_prototypes:
                - uuid: 4b73a0e69b414773a7bc2d1f4b3320c3
                  expression: 'min(/Template - Graylog Monitoring by REST API/graylog.stream.rule.execution_time.p95[{#STREAM.ID},{#RULE.ID}],{$GRAYLOG.STREAM.RULE.P95.PERIOD})>{$GRAYLOG.STREAM.RULE.P95.WARN}'
                  name: 'Graylog: Stream [{#STREAM.ID}] rule [{#RULE.ID}] execution is slow'
                  priority: WARNING
                  description: 'Alerts when the stream rule p95 execution time remains above the configured threshold during the configured period.'
                  tags:
                    - tag: scope
                      value: performance
                    - tag: template
                      value: Graylog-HTTP-API
          master_item:
            key: graylog.metrics.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var configured = '{$GRAYLOG.STREAM.RULES}'.trim();
                  if (configured === '') return '[]';
                  var limit = parseInt('{$GRAYLOG.STREAM.RULE.MAX}', 10);
                  if (!isFinite(limit) || limit < 1) return '[]';
                  if (limit > 20) limit = 20;
                  var timers = d.timers || {};
                  var result = [];
                  var seen = {};
                  configured.split(',').forEach(function (entry) {
                      if (result.length >= limit) return;
                      var pair = entry.trim().toLowerCase().split(':');
                      if (pair.length !== 2) return;
                      var streamId = pair[0].trim();
                      var ruleId = pair[1].trim();
                      if (!/^[a-f0-9]{24}$/.test(streamId) || !/^[a-f0-9]{24}$/.test(ruleId)) return;
                      var unique = streamId + ':' + ruleId;
                      if (seen[unique]) return;
                      var metric = 'org.graylog2.plugin.streams.Stream.' + streamId + '.StreamRule.' + ruleId + '.executionTime';
                      var data = timers[metric];
                      if (!data || typeof data.p95 === 'undefined') return;
                      seen[unique] = true;
                      result.push({
                          '{#STREAM.ID}': streamId,
                          '{#RULE.ID}': ruleId,
                          '{#STREAM.RULE.METRIC}': metric
                      });
                  });
                  return JSON.stringify(result);
