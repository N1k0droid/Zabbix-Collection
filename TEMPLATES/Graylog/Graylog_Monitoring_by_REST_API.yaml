zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7aa3d4a70f2042e9b49b8f269bf0f8ec
      name: Templates/Applications
  templates:
    - uuid: 29169d4f84ab4b158a13ebc72e5f4848
      template: 'Template - Graylog Monitoring by REST API'
      name: 'Template - Graylog Monitoring by REST API'
      description: |
        Monitors Graylog through a single HTTP API request to the system metrics endpoint. The template collects application, buffer, journal, JVM, multi-version scheduler discovery, throughput, logging, indexing, pipeline, and processing metrics. Low-level discovery detects Graylog inputs, aggregation event processors, and a fixed allowlist of scheduler metrics. Input and event processor discovery rules are capped at 100 entities each. Scheduler discovery creates at most seven metric items. No discovery enumerates arbitrary API metric names. Optional stream and stream rule discovery rules are disabled by empty allowlist macros and are hard-limited to 20 configured entities each.
        
        Required configuration:
          - {$GRAYLOG.ENDPOINT}: Graylog API hostname or IP address.
          - {$GRAYLOG.API.SCHEME}: API protocol, either http or https. Default: https.
          - {$GRAYLOG.API.PORT}: Graylog REST API port. Default: 9000.
          - {$GRAYLOG.API.PATH}: Graylog metrics endpoint path. Default: /api/system/metrics.
          - {$GRAYLOG.API.USER}: Graylog monitoring user with permission to read system metrics.
          - {$GRAYLOG.API.PASSWORD}: Password for the Graylog monitoring user.
          - {$GRAYLOG.API.INTERVAL}: Metrics polling interval. Default: 1m.
          - {$GRAYLOG.API.TIMEOUT}: HTTP request timeout. Default: 15s.
          - {$GRAYLOG.TCP.PORT}: TCP port used for the service availability check. Default: 9000.
        
        The Graylog API user must use Basic authentication and have access to the system metrics endpoint.
        
        The API URL is built as follows:
        {$GRAYLOG.API.SCHEME}://{$GRAYLOG.ENDPOINT}:{$GRAYLOG.API.PORT}{$GRAYLOG.API.PATH}
        
        HTTPS certificate and hostname verification are enabled. For HTTP connections, set {$GRAYLOG.API.SCHEME} to http. Optional or version-specific metrics that are not exposed by the monitored Graylog instance are discarded without making the related items unsupported.
      vendor:
        name: N1k0droid
        version: '6.0'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 6c2b44f11123443291d6541d3c09e536
          name: 'Graylog API status'
          type: DEPENDENT
          key: graylog.api.status
          delay: '0'
          history: 7d
          description: 'Shows whether the Graylog metrics API returned a valid JSON payload.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if (value === ''ERROR_STATE'') return 0; try { var d = JSON.parse(value); return (d && typeof d === ''object'' && !Array.isArray(d)) ? 1 : 0; } catch (e) { return 0; }'
          master_item:
            key: graylog.metrics.raw
          tags:
            - tag: component
              value: api
            - tag: template
              value: Graylog-HTTP-API
          triggers:
            - uuid: c65936ca0feb441c826d74fb8b5e7f35
              expression: 'last(/Template - Graylog Monitoring by REST API/graylog.api.status)=0'
              name: 'Graylog: API metrics payload is invalid'
              priority: HIGH
              description: 'Alerts when the Graylog metrics API returns an empty, HTML, invalid, or unexpected payload.'
              tags:
                - tag: scope
                  value: availability
                - tag: template
                  value: Graylog-HTTP-API
        - uuid: 8b1f82eff5e24e538ef7d65e65d4eb34
          name: 'Input buffer utilization'
          type: DEPENDENT
          key: graylog.buffer.input.utilization
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Current input buffer slots in use.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var d=JSON.parse(value),g=d.gauges||{},s=g[''org.graylog2.buffers.input.size''],u=g[''org.graylog2.buffers.input.usage''];if(!s||!u||s.value<=0)throw ''Metric unavailable'';return 100*u.value/s.value;'
          master_item:
            key: graylog.metrics.raw
          tags:
            - tag: component
              value: buffers
            - tag: template
              value: Graylog-HTTP-API
          triggers:
            - uuid: 403d4582038e4e5ab74c28ce2ae5c61e
              expression: 'min(/Template - Graylog Monitoring by REST API/graylog.buffer.input.utilization,5m)>{$GRAYLOG.BUFFER.HIGH}'
              name: 'Graylog: input buffer utilization is critical'
              priority: HIGH
              description: 'Alerts when input buffer utilization is critical.'
              tags:
                - tag: scope
                  value: performance
                - tag: template
                  value: Graylog-HTTP-API
            - uuid: 7c1628ffbd394243b2f73e7bf3388d8c
              expression: 'min(/Template - Graylog Monitoring by REST API/graylog.buffer.input.utilization,10m)>{$GRAYLOG.BUFFER.WARN}'
              name: 'Graylog: input buffer utilization is high'
              priority: WARNING
              description: 'Alerts when input buffer utilization is high.'
              dependencies:
                - name: 'Graylog: input buffer utilization is critical'
                  expression: 'min(/Template - Graylog Monitoring by REST API/graylog.buffer.input.utilization,5m)>{$GRAYLOG.BUFFER.HIGH}'
              tags:
