        - uuid: ff9f8cb464ca4076aef577fdee355abc
          name: 'Indexer buffer flush failures'
          type: DEPENDENT
          key: graylog.elasticsearch.flush_failures
          delay: '0'
          description: 'Cumulative indexer buffer flush failures. Supports current and legacy Graylog output metric names.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var sections = [d.meters || {}, d.counters || {}];
                  var candidates = [
                      'org.graylog2.outputs.BatchedMessageFilterOutput.bufferFlushFailures',
                      'org.graylog2.outputs.BlockingBatchedESOutput.bufferFlushFailures'
                  ];
                  
                  for (var i = 0; i < candidates.length; i++) {
                      for (var j = 0; j < sections.length; j++) {
                          var metric = sections[j][candidates[i]];
                          if (!metric) continue;
                          if (typeof metric.count !== 'undefined') return metric.count;
                          if (typeof metric.value !== 'undefined') return metric.value;
                      }
                  }
                  
                  throw 'Indexer buffer flush failure metric is unavailable';
          master_item:
            key: graylog.metrics.raw
          tags:
            - tag: component
              value: indexing
            - tag: template
              value: Graylog-HTTP-API
          triggers:
            - uuid: 2a74b89249b44d37ae81fa7328e36f8a
              expression: 'change(/Template - Graylog Monitoring by REST API/graylog.elasticsearch.flush_failures)>0 and change(/Template - Graylog Monitoring by REST API/graylog.elasticsearch.flush_failures)<1000000'
              name: 'Graylog: New indexer buffer flush failures'
              priority: HIGH
              description: 'Alerts when the indexer reports new buffer flush failures.'
              tags:
                - tag: scope
                  value: performance
                - tag: template
                  value: Graylog-HTTP-API
        - uuid: c0a5a7caa5a54996b84cfb969b979c4a
