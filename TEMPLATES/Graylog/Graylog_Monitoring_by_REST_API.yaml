        - uuid: 12e3b41f8b794d76bf53437a3f0802cb
          name: 'Graylog: Get metrics'
          type: HTTP_AGENT
          key: graylog.metrics.raw
          delay: '{$GRAYLOG.API.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$GRAYLOG.API.USER}'
          password: '{$GRAYLOG.API.PASSWORD}'
          description: 'Retrieves the Graylog operational metrics payload.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s;
                  if (value === null || typeof value === 'undefined') throw 'Empty response';
                  s = String(value).trim();
                  if (s === '') throw 'Empty response';
                  if (s.charAt(0) === '<' || /<!doctype\s+html/i.test(s) || /<html[\s>]/i.test(s)) throw 'HTML response';
                  var d;
                  try { d = JSON.parse(s); } catch (e) { throw 'Invalid JSON'; }
                  if (d === null || typeof d !== 'object' || Array.isArray(d)) throw 'JSON root is not an object';
                  if (!Object.prototype.hasOwnProperty.call(d, 'gauges') && !Object.prototype.hasOwnProperty.call(d, 'meters') && !Object.prototype.hasOwnProperty.call(d, 'counters') && !Object.prototype.hasOwnProperty.call(d, 'timers')) throw 'Graylog metric sections are missing';
                  return s;
          timeout: '{$GRAYLOG.API.TIMEOUT}'
          url: '{$GRAYLOG.API.SCHEME}://{$GRAYLOG.ENDPOINT}:{$GRAYLOG.API.PORT}{$GRAYLOG.API.PATH}'
          headers:
            - name: Accept
              value: application/json
          verify_peer: 'YES'
          verify_host: 'YES'
          tags:
            - tag: component
              value: raw
            - tag: template
              value: Graylog-HTTP-API
        - uuid: 537466d668164b4ebbb21b2282346a55
          name: 'Pipeline execution time p95'
